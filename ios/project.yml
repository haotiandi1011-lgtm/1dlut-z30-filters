name: Z30Tone

options:
  bundleIdPrefix: com.z30tone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 对外版本号固定 v0.3.0；每次构建只递增 build 号（CI 里用 run number 覆盖）。
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:

  # 纯 Foundation 的核心库：载荷 / 配方 / 拟合算法。
  # 刻意不依赖 SwiftUI，这样它能被单测直接打，也方便以后做 macOS 版。
  Z30ToneCore:
    type: framework
    platform: iOS
    sources:
      - path: Z30Tone/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z30tone.core
        PRODUCT_NAME: Z30ToneCore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"

  Z30Tone:
    type: application
    platform: iOS
    sources:
      - path: Z30Tone/App
      - path: Z30Tone/Resources
      # UI 目录等第一张卡片落地后再加进来，避免空目录让 xcodegen 报错
      # - path: Z30Tone/UI
    dependencies:
      - target: Z30ToneCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z30tone.app
        PRODUCT_NAME: Z30Tone
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Z30Tone/App/Info.plist
      properties:
        CFBundleDisplayName: Z30 影调
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让「文件」App 能直接读写本机配方目录
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 连相机 Wi-Fi 时要访问局域网地址（192.168.1.1）
        NSLocalNetworkUsageDescription: 连接相机 Wi-Fi 时需要访问局域网地址，用于读取和写入机身的自定义曲线。
        NSPhotoLibraryUsageDescription: 选择照片用于生成影调曲线，以及在预览台上做分割线对比。
        ITSAppUsesNonExemptEncryption: false

  Z30ToneCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Z30ToneCoreTests
    dependencies:
      - target: Z30ToneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z30tone.coretests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Z30Tone:
    build:
      targets:
        Z30Tone: all
        Z30ToneCore: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Z30ToneCoreTests
