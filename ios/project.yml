name: Z30Tone

options:
  bundleIdPrefix: com.z30tone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 对外版本号固定 v0.3.0；每次构建只递增 build 号（CI 里用 run number 覆盖）。
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

# 刻意**不做 framework**。
# 一开始把 Core 拆成 framework，结果 app 侧 11 个 "cannot find type in scope"——
# Swift 的默认访问级别是 internal，framework 里的类型对 app 不可见，得给每个类型、
# 每个方法都补 public。这个项目不值得为模块边界付这个代价，所以 app 和测试各自
# 直接编译 Core 源码：没有边界，就不需要 public。
targets:

  Z30Tone:
    type: application
    platform: iOS
    sources:
      - path: Z30Tone/App
      - path: Z30Tone/UI
      - path: Z30Tone/Core
      - path: Z30Tone/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z30tone.app
        PRODUCT_NAME: Z30Tone
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Z30Tone/App/Info.plist
      properties:
        CFBundleDisplayName: Z30 影调
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让「文件」App 能直接读写本机配方目录
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 连相机 Wi-Fi 时要访问局域网地址（192.168.1.1）
        NSLocalNetworkUsageDescription: 连接相机 Wi-Fi 时需要访问局域网地址，用于读取和写入机身的自定义曲线。
        NSPhotoLibraryUsageDescription: 选择照片用于生成影调曲线，以及在预览台上做分割线对比。
        ITSAppUsesNonExemptEncryption: false

  # logic test：自己带一份 Core 源码，不依赖 app，不需要 host，跑得快。
  Z30ToneCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Z30Tone/Core
      - path: Tests/Z30ToneCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z30tone.coretests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Z30Tone:
    build:
      targets:
        Z30Tone: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Z30ToneCoreTests
